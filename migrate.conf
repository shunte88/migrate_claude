# ---------------------------------------------------------------------------
# migrate.conf - settings for migrate.sh
# Edit these, then run:  ./migrate.sh --dry-run all
# ---------------------------------------------------------------------------

# Replacement machine. TARGET_HOST may be an ~/.ssh/config alias.
TARGET_HOST="media2026"
TARGET_USER="stuart"
TARGET_HOME="/home/stuart"

# Source paths on this (retiring) machine.
SRC_HOME="/home/stuart"
SRC_WORK="/data2"

# Where the working tree lands on the replacement.
DST_WORK="/data2"

# Staging area for consistent database snapshots.
STAGE="/tmp/migrate-stage"

# Dotfiles copied by the 'dotfiles' phase (paths relative to SRC_HOME).
DOTFILES=(
  .bashrc
  .profile
  .gitconfig
  .abcde.conf
  .ssh/config
)

# Secret material copied only by the 'secrets' phase, which requires
# an explicit --with-secrets flag. Paths relative to SRC_HOME.
SECRET_FILES=(
  .ssh/id_ed25519
  .ssh/id_ed25519.pub
  .ssh/aws_rsa
  .ssh/aws_rsa.pub
  .ssh/ispec_rsa
  .ssh/ispec_rsa.pub
  .ssh/ispecp_rsa
  .ssh/ispecp_rsa.pub
  .netrc
  .git-credentials
  .config/gh/hosts.yml
  .aws/credentials
  .aws/config
)

# Keys stripped from ~/.claude.json before transfer.
# machineID must be regenerated per host; the caches refresh on first launch.
SANITIZE_KEYS=(
  machineID
  cachedStatsigGates
  cachedGrowthBookFeatures
  cachedGrowthBookFeaturesAt
  cachedDynamicConfigs
  cachedExperimentFeatures
  cachedExperimentData
  clientDataCache
  clientDataCacheSlots
  modelAccessCache
  additionalModelOptionsCache
  additionalModelCostsCache
  metricsStatusCache
  autoCompactWindowsCache
  orgModelDefaultCache
)

# Keys stripped unless --with-secrets is given.
SANITIZE_SECRET_KEYS=(
  primaryApiKey
  customApiKeyResponses
)
